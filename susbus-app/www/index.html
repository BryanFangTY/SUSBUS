<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
  <title>SUSBUS 校园巴士实时系统</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 启动加载动画：初始化流程用 try/finally 保证任何异常下都会被隐藏 -->
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash__logo">SUSBUS</div>
    <div class="splash__spinner" aria-hidden="true"></div>
    <p class="splash__text">正在加载…</p>
  </div>

  <main class="bus-vehicles">
    <header class="bus-vehicles__header">
      <h1>SUSBUS</h1>
      <label class="all-vehicles" for="toggleAllVehicles">
        <input id="toggleAllVehicles" type="checkbox">
        <span>所有车辆（包括暂停服务）</span>
      </label>
    </header>

    <div class="map-head">
      <time id="lastUpdated" aria-live="polite"></time>
    </div>

    <section class="bus-map" id="mapSection">
      <div id="map" class="bus-map__canvas" role="application" aria-label="车辆地图"></div>
      <p id="mapMessage" class="bus-map__message" role="alert" hidden></p>
      <div class="bus-map__legend" role="img" aria-label="车型图例：巴士、电瓶车">
        <span><img src="img/bus.png" alt="">巴士</span>
        <span><img src="img/sev.png" alt="">电瓶车</span>
      </div>
      <label class="bus-map__overlap" for="toggleAvoidOverlap">
        <input id="toggleAvoidOverlap" type="checkbox" checked>
        <span>避免重叠</span>
      </label>
    </section>

    <p id="vehiclesState" class="state muted" hidden></p>
  </main>

  <button id="refreshBtn" class="bus-refresh-button" type="button" aria-label="立即刷新车辆数据" title="立即刷新车辆数据">
    <svg class="bus-refresh-button__progress" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
      <circle class="track" cx="20" cy="20" r="18"></circle>
      <circle class="value" cx="20" cy="20" r="18"></circle>
    </svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
      <path d="M21 3v5h-5"></path>
      <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
      <path d="M8 16H3v5"></path>
    </svg>
  </button>

  <script src="cordova.js"></script>
  <script src="vendor/pmtiles.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
